<section class="space-y-6 p-6">
  <app-page-header
    title="Gestión de Tareas"
    subtitle="Tareas"
    buttonLabel="Nueva Tarea"
    (buttonClick)="createOpen.set(true)"
  />

  <div
    class="grid gap-4 rounded-lg border border-slate-200 bg-white p-4 shadow-sm sm:grid-cols-2 lg:grid-cols-4 mt-3"
  >
    <app-users-selector
      [users]="users()"
      [selectedId]="filterUserId()"
      (selectionChange)="onFilterUserChange($event)"
    />

    <div class="space-y-1.5">
      <label for="filter-status" class="block text-sm font-medium text-slate-700"> Estado </label>
      <select
        id="filter-status"
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-ink shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 disabled:cursor-not-allowed disabled:bg-slate-50 disabled:text-slate-400"
        [value]="filterStatus()"
        [disabled]="filterUserId() == null"
        (change)="onFilterStatusChange($event)"
      >
        @for (option of statusOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="space-y-1.5">
      <label for="filter-priority" class="block text-sm font-medium text-slate-700">
        Prioridad
      </label>
      <select
        id="filter-priority"
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-ink shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20"
        [value]="filterPriority()"
        (change)="onFilterPriorityChange($event)"
      >
        @for (option of priorityOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="space-y-1.5">
      <label for="filter-order-by" class="block text-sm font-medium text-slate-700">
        Ordenar por
      </label>
      <select
        id="filter-order-by"
        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-ink shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20"
        [value]="filterOrderBy()"
        (change)="onFilterOrderByChange($event)"
      >
        @for (option of orderByOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </div>

  @if (loading()) {
    <app-table-skeleton [rows]="5" [columns]="5" />
  } @else {
    <app-tasks-table
      [tasks]="tasks()"
      [advancingId]="advancingId()"
      [updatingPriorityId]="updatingPriorityId()"
      (advanceStatus)="onAdvanceStatus($event)"
      (priorityChange)="onPriorityChange($event)"
    />
  }
</section>

@if (createOpen()) {
  <app-create-task-modal
    [users]="users()"
    (closed)="createOpen.set(false)"
    (created)="onTaskCreated()"
  />
}

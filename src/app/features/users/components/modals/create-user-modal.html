<div
  class="fixed inset-0 z-40 flex items-center justify-center p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="create-user-title"
>
  <button
    type="button"
    class="absolute inset-0 bg-black/40"
    aria-label="Cerrar modal"
    (click)="requestClose()"
  ></button>

  <div
    class="relative z-10 w-full max-w-md rounded-xl border border-slate-200 bg-white shadow-xl"
  >
    <div
      class="flex items-center justify-between border-b border-slate-100 px-5 py-4"
    >
      <h2 id="create-user-title" class="text-lg font-semibold text-ink">
        Nuevo usuario
      </h2>
      <button
        type="button"
        class="inline-flex size-8 items-center justify-center rounded-md text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-700 disabled:cursor-not-allowed disabled:opacity-50"
        aria-label="Cerrar"
        [disabled]="submitting()"
        (click)="requestClose()"
      >
        <svg
          class="size-4"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>

    <div class="px-5 py-4">
      <app-user-form
        [submitting]="submitting()"
        (submitted)="onFormSubmit($event)"
      />
    </div>
  </div>
</div>

<div class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm mt-3">
  <div class="overflow-x-auto">
    <table class="w-full min-w-[40rem] border-collapse text-left text-sm">
      <thead>
        <tr
          class="border-b border-slate-200 bg-slate-50 text-xs font-semibold uppercase tracking-wider text-slate-500"
        >
          <th class="px-4 py-3">Usuario</th>
          <th class="px-4 py-3">Rol</th>
          <th class="px-4 py-3">Registro</th>
        </tr>
      </thead>
      <tbody>
        @if (users().length === 0) {
          <tr app-empty-row [colspan]="3" message="No hay usuarios"></tr>
        } @else {
          @for (user of users(); track user.id) {
            <tr class="border-b border-slate-100 last:border-b-0 hover:bg-slate-50/80">
              <td class="px-4 py-3">
                <div class="flex items-center gap-3">
                  <span
                    class="flex size-9 shrink-0 items-center justify-center rounded-full bg-brand-100 text-xs font-semibold text-brand-700"
                    aria-hidden="true"
                  >
                    {{ getInitials(user.name) }}
                  </span>
                  <div class="min-w-0">
                    <p class="truncate font-medium text-ink">{{ user.name }}</p>
                    <p class="truncate text-xs text-slate-500">{{ user.mail }}</p>
                  </div>
                </div>
              </td>
              <td class="px-4 py-3">
                <app-role-badge [rol]="user.rol" />
              </td>
              <td class="px-4 py-3 whitespace-nowrap text-slate-600">
                {{ user.createdDate | date: 'd MMM y' }}
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</div>
